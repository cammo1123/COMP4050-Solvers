name: Setup build environment
description: Installs pnpm, Node, project dependencies, and the FlatBuffers compiler

runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@v4
      with:
        version: 11.21.0

    - uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: pnpm
        cache-dependency-path: pnpm-lock.yaml

    - name: Install dependencies
      shell: bash
      run: pnpm install

    - name: Cache flatc
      uses: actions/cache@v4
      with:
        path: node/.flatc
        key: flatc-${{ runner.os }}-25.12.19

    - name: Install flatc (FlatBuffers compiler)
      shell: bash
      run: node node/scripts/generate.mjs --version
