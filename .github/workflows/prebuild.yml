name: prebuild

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  prebuild:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    defaults:
      run:
        working-directory: node
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.20.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: node/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install

      - name: Build (CMake/Ninja)
        run: pnpm build

      - name: Snapshot prebuilt binary
        run: pnpm prebuild:binaries

      - name: Test
        run: pnpm test

      - name: Standalone smoke test
        shell: bash
        run: |
          BINARY=$([[ "$RUNNER_OS" == "Windows" ]] && echo "../build/cmake/solvers.exe" || echo "../build/cmake/solvers")
          "$BINARY" 21

      - name: Upload prebuilds
        uses: actions/upload-artifact@v4
        with:
          name: prebuilds-${{ matrix.os }}
          path: node/prebuilds/

  commit:
    needs: prebuild
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download prebuilds
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Merge prebuilds
        run: |
          mkdir -p node/prebuilds
          cp -R artifacts/*/. node/prebuilds/

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f node/prebuilds
          git diff --cached --quiet || git commit -m "chore: update prebuilt binaries [skip ci]"
          git push
