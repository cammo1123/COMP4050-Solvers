name: test

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.21.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install

      - name: Cache flatc
        uses: actions/cache@v4
        with:
          path: node/.flatc
          key: flatc-${{ runner.os }}-25.12.19

      - name: Install flatc (FlatBuffers compiler)
        run: node node/scripts/generate.mjs --version

      - name: Build addon (CMake/Ninja)
        run: pnpm build

      - name: Run node tests
        run: pnpm test

  commit-dist:
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.21.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install

      - name: Build dist (tsc)
        run: pnpm build:ts

      - name: Commit and push dist
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f node/dist
          git diff --cached --quiet || git commit -m "chore: update dist [skip ci]"
          git push
