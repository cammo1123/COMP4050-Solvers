name: test

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.21.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install

      - name: Cache flatc
        uses: actions/cache@v4
        with:
          path: node/.flatc
          key: flatc-${{ runner.os }}-25.12.19

      - name: Install flatc (FlatBuffers compiler)
        run: node node/scripts/generate.mjs --version

      - name: Build addon (CMake/Ninja, max optimization)
        run: pnpm build:optimized

      - name: Run node tests
        run: pnpm test

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-${{ runner.os }}
          path: |
            node/build/Release/addon.node
            build/addon/solvers
            build/addon/solvers.exe
          if-no-files-found: ignore
