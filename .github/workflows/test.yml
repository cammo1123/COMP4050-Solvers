name: test

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: node
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.20.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: node/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install

      - name: Build addon (CMake/Ninja)
        run: pnpm build

      - name: Run node tests
        run: pnpm test
