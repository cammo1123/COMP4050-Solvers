name: test

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-build

      - name: Build addon (CMake/Ninja, max optimization)
        run: pnpm build:optimized

      - name: Run node tests
        run: pnpm test

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-${{ runner.os }}
          path: |
            node/build/Release/addon.node
            build/addon/solver
            build/addon/solver.exe
          if-no-files-found: ignore
